services:
  # --- Backend: FastAPI ---
  - type: web
    name: flavorfinder-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # --- Frontend: React/Vite Static Site ---
  - type: web
    name: flavorfinder-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://flavorfinder-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
